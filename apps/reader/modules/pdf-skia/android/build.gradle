plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.icybear.pdfskia'
version = '0.1.0'

android {
  namespace "com.icybear.pdfskia"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("io.legere:pdfiumandroid:2.0.1")
}
